name: Security Audit

on:
  # No paths filter on pull_request: `security` is a required check on main, and a
  # path-filtered required check never reports on PRs that don't touch deps, which
  # blocks them forever (hit on #69, 2026-09-28). The audit itself is ~20 s.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Audit the LOCKED project dependencies, not pip-audit's own ephemeral
      # venv (the bare `uvx pip-audit` bug: it saw requests/rich, never
      # fastmcp/torch). torch's local +cpu tag isn't on PyPI, so strip it —
      # 2.12.1+cpu and 2.12.1 share advisories.
      - name: Export locked requirements
        run: |
          uv export --format requirements-txt --no-emit-project -o requirements.txt
          sed -i 's/+cpu//' requirements.txt

      - name: Security audit (pip-audit)
        run: uvx pip-audit==2.9.0 --no-deps --disable-pip -r requirements.txt
