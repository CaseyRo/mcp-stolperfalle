[project]
name = "mcp-stolperfalle"
version = "0.1.0"
description = "Experiential knowledge capture and recall MCP server for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Casey Romkes" }]
dependencies = [
    "fastmcp>=3.4.7,<4.0.0",  # 3.4.3+: allowed_hosts kwarg (Host-header guard)
    "httpx>=0.28.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.15.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=5.6.1",
    "torch>=2.13.0",  # direct dep so tool.uv.sources can pin the linux CPU index; 2.13.0: GHSA-rrmf-rvhw-rf47
    # Security floors (transitive deps of fastmcp/torch; pinned to address CVEs)
    "authlib>=1.7.0",            # GHSA: CSRF in token cache handling
    "python-multipart>=0.0.27",  # GHSA: DoS via unbounded multipart headers
    "mcp>=1.28.1",               # PYSEC-2026-3481/3482/3483 (via fastmcp-slim)
    "setuptools>=84.0.0",        # PYSEC-2026-3447 (via torch)
    "transformers>=5.10.0",      # GHSA-xrqw-3rrv-vx5w (via sentence-transformers)
]

[project.scripts]
mcp-stolperfalle = "stolperfalle.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stolperfalle"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "jsonschema>=4.23",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly rather than inheriting ruff's defaults, which widen between
# releases: 0.15.12 -> 0.16.5 turned a clean tree into 25 findings, six of them
# BLE001 objections to defensive `except Exception` that this server wants.
# A linter's rule set should be a decision, not whatever shipped last.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = [
    # UP042 wants StrEnum, which changes str(KUKind.pitfall) from
    # "KUKind.pitfall" to "pitfall". These values are persisted, so that is a
    # data-format decision and not something to slip into a tooling bump.
    "UP042",
    # RUF001/2/3 flag "ambiguous" unicode — en dashes in comments, x in
    # "3 x retry". That rule exists to catch homoglyph attacks in identifiers;
    # in prose it just objects to correct typography.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.uv.sources]
# nebula-1 is a CPU-only VM: lock CPU torch wheels for linux so the Docker
# build installs from the lockfile without pulling ~5 GB of nvidia-cuda-*.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
